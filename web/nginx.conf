# EPUB 库 Web 服务 —— nginx 站点配置
# 职责：
#   1. 托管前端构建产物（SPA 路由回退到 index.html）
#   2. 把 /api 反向代理到后端容器(backend:8002)，并支持 SSE 阅读进度流
#      （后端路径：/api/health、/api/books/**、/api/progress/**、/api/tasks/**）

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 开启 gzip，压缩文本类静态资源
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA：找不到真实文件时统一回退到 index.html，交给前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源（vite 输出到 /assets/）可长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反代
    location /api/ {
        proxy_pass http://backend:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 阅读进度是 SSE 长连接：关闭缓冲、加长超时，避免被 nginx 缓存/截断
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
