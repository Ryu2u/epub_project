[package]
name = "epub-library-app"
version = "0.1.0"
description = "EPUB Reader + 书籍库 桌面客户端"
edition = "2021"

# 严格 clippy(与业务模块一致)
[lints.clippy]
all = "deny"

[lib]
name = "epub_library_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2(tray-icon:系统托盘)
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 数据库
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "chrono", "uuid"] }

# EPUB 解析
quick-xml = "0.36"
scraper = "0.20"

# TXT 编码检测/转换(GBK/GB18030/Big5/UTF-16 → UTF-8)
chardetng = "0.1"
encoding_rs = "0.8"

# 文件 / 加密
zip = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

# 工具
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 配置
dotenvy = "0.15"

# 腾讯云对象存储 COS SDK(传递依赖 reqwest,需要显式导入以使用 Method)
cos_rs = "0.1"
reqwest = "0.13"

[profile.release]
# Tauri 推荐的发布优化
codegen-units = 1
lto = true
opt-level = "s"
strip = true
