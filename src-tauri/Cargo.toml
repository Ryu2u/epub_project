[package]
name = "epub-library-app"
version = "0.1.0"
description = "EPUB Reader + 书籍库 桌面客户端"
edition = "2021"

# 严格 clippy(与 backend-rs 一致)
[lints.clippy]
all = "deny"

[lib]
name = "epub_library_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2(tray-icon:系统托盘)
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"

# 复用后端业务库(service / epub 解析 / 进度任务 / schema)
epub-backend-rs = { path = "../backend-rs" }

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "chrono"] }

[profile.release]
# Tauri 推荐的发布优化
codegen-units = 1
lto = true
opt-level = "s"
strip = true
